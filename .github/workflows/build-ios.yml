name: Build iOS TrollStore IPA

# 公开仓库只负责真实 Xcode 构建与移交；最终分发由产物仓库的 version2.json 管理。
on:
  push:
    branches: [main]
    paths:
      - 'ios-shell/**'
      - 'native-shared/**'
      - 'public/icons/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 公开仓库的标准 macOS runner 免费，无需自托管。
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          # 打印可用版本，选中最新稳定版；build.sh 需要完整 Xcode 而非仅 CLT。
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('native-shared/**/*.gradle.kts', 'native-shared/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 源码契约检查
        run: python3 -I ios-shell/test.py

      - name: 构建 iOS 壳（含 KMP framework，ad-hoc 签名）
        run: |
          chmod +x native-shared/gradlew ios-shell/build.sh
          # 用 pipefail 保住 build.sh 的退出码；否则 tee 会把失败吞成成功。
          set -o pipefail
          # 正式版本和 build 仅由 host Info.plist 定版，CI 的运行次数不参与包版本。
          bash ios-shell/build.sh --output-dir "$RUNNER_TEMP/out" 2>&1 | tee build.log

      - name: 摘要编译错误
        if: failure()
        run: |
          # 把 Swift/Kotlin 编译错误直接写进 job summary，省得去翻整包日志。
          {
            echo '## 构建失败：编译错误摘要'
            echo '```'
            grep -aE '\.swift:[0-9]+:[0-9]+: error:|e: file.*\.kt:' build.log 2>/dev/null | head -40 || echo '(no compiler error lines found)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 记录源码指纹
        if: always()
        run: |
          python3 -I ios-shell/build-support.py inputs --root . --manifest "$RUNNER_TEMP/build-inputs.json" || true
          if [[ -f "$RUNNER_TEMP/build-inputs.json" ]]; then
            python3 -I -c "import json,sys;d=json.load(open(sys.argv[1]));print('sourceTreeSha256='+str(d.get('sourceTreeSha256','')))" "$RUNNER_TEMP/build-inputs.json"
          fi

      - name: 校验产物
        run: |
          IPA="$RUNNER_TEMP/out/zeehowebnext.ipa"
          [[ -f "$IPA" ]] || { echo "BLOCKED: IPA not produced"; ls -R "$RUNNER_TEMP/out" || true; exit 1; }
          ls -l "$IPA"
          shasum -a 256 "$IPA" | tee "$RUNNER_TEMP/SHA256SUMS"
          # 结构校验：arm64 Mach-O + 签名结构存在（ad-hoc 也算已签名）
          python3 -I ios-shell/test.py "$IPA"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 上传构建产物供正式发布移交
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/out/zeehowebnext.ipa
            ${{ runner.temp }}/out/version2.json
            ${{ runner.temp }}/out/build-manifest.json
            ${{ runner.temp }}/out/source-commit.txt
            ${{ runner.temp }}/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
