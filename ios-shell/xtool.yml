# xtool 1.24.0 PackSchema v1; build-xtool.sh stages and expands Info.plist before building.
version: 1
product: DashboardIOS
bundleID: io.github.lswlc33.dashboard.ios
infoPath: Info.plist
entitlementsPath: XtoolSupport/App.entitlements
# 图标必须用满出血的 iOS 专用源：xtool 后端同样会产出 App 包，
# 用带圆角的 icon-512.png 会让 iOS 再切一次角，四角透出白边。
iconPath: ../public/icons/icon-ios-1024.png
resources:
  - bridge-bootstrap.js
extensions:
  - product: DashboardWidgets
    bundleID: io.github.lswlc33.dashboard.ios.widgets
    infoPath: Widgets/Info.plist
    entitlementsPath: XtoolSupport/Widgets.entitlements
skipLSP: true
